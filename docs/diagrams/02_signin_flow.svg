<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700">
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22404A"/></marker>
    <marker id="a-inks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22404A"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E7FA3"/></marker>
    <marker id="a-blues" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E7FA3"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7235"/></marker>
    <marker id="a-oranges" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7235"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D5B"/></marker>
    <marker id="a-oks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D5B"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5462F"/></marker>
    <marker id="a-reds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5462F"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52707A"/></marker>
    <marker id="a-muteds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52707A"/></marker></defs>
  <rect width="1240" height="700" fill="#fff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#186F90" font-family="Carlito">Figure B · Sign-in and access check</text>
  <rect x="40" y="90" width="200" height="56" rx="28" fill="#E1EFF3" stroke="#1E7FA3" stroke-width="2"/><text x="140" y="123.25" text-anchor="middle" font-size="15" font-weight="700"
      fill="#22404A" font-family="Carlito">Open the web address</text><rect x="40" y="220" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#186F90" stroke-width="2"/><text x="140" y="250.65" text-anchor="middle" font-size="15" font-weight="700"
      fill="#22404A" font-family="Carlito">Sign in with Google</text><text x="140" y="269.85" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">popup (redirect if blocked)</text><rect x="40" y="365" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#186F90" stroke-width="2"/><text x="140" y="395.65" text-anchor="middle" font-size="15" font-weight="700"
      fill="#22404A" font-family="Carlito">Firebase Auth</text><text x="140" y="414.84999999999997" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">verifies Google account</text><path d="M140,146 L140,220" fill="none" stroke="#22404A" stroke-width="2"  marker-end="url(#a-ink)" /><path d="M140,290 L140,365" fill="none" stroke="#22404A" stroke-width="2"  marker-end="url(#a-ink)" /><path d="M240,400 L330,400" fill="none" stroke="#22404A" stroke-width="2"  marker-end="url(#a-ink)" /><path d="M440,340 L550,400 L440,460 L330,400 Z" fill="#FCEFD2" stroke="#946200" stroke-width="2"/><text x="440" y="395.94" text-anchor="middle" font-size="14" font-weight="700"
      fill="#22404A" font-family="Carlito">Email in</text><text x="440" y="413.86" text-anchor="middle" font-size="12" font-weight="400"
      fill="#52707A" font-family="Carlito">OWNER_EMAILS?</text><path d="M440,340 L440,200 L500,200" fill="none" stroke="#2F7D5B" stroke-width="2"  marker-end="url(#a-ok)" /><rect x="424.25" y="258.875" width="31.5" height="22.25" rx="5" fill="#fff" fill-opacity="0.95"/><text x="440" y="272.875" text-anchor="middle" font-size="13" fill="#2F7D5B" font-family="Carlito" font-weight="700">yes</text><rect x="500" y="160" width="270" height="80" rx="10" fill="#DFF1E8" stroke="#2F7D5B" stroke-width="2"/><text x="635" y="186.05" text-anchor="middle" font-size="15" font-weight="700"
      fill="#22404A" font-family="Carlito">Role = admin (owner)</text><text x="635" y="205.25" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">create users/{email} if missing</text><text x="635" y="224.45000000000002" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">(owner: true)</text><path d="M550,400 L620,400" fill="none" stroke="#22404A" stroke-width="2"  marker-end="url(#a-ink)" /><rect x="572.5" y="373.875" width="25" height="22.25" rx="5" fill="#fff" fill-opacity="0.95"/><text x="585" y="387.875" text-anchor="middle" font-size="13" fill="#22404A" font-family="Carlito" font-weight="700">no</text><rect x="620" y="360" width="200" height="80" rx="10" fill="#E1EFF3" stroke="#1E7FA3" stroke-width="2"/><text x="720" y="395.65" text-anchor="middle" font-size="15" font-weight="700"
      fill="#22404A" font-family="Carlito">Read users/{email}</text><text x="720" y="414.84999999999997" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">from Firestore</text><path d="M820,400 L920,400" fill="none" stroke="#22404A" stroke-width="2"  marker-end="url(#a-ink)" /><path d="M1030,335 L1140,400 L1030,465 L920,400 Z" fill="#FCEFD2" stroke="#946200" stroke-width="2"/><text x="1030" y="386.97999999999996" text-anchor="middle" font-size="14" font-weight="700"
      fill="#22404A" font-family="Carlito">Doc exists,</text><text x="1030" y="404.9" text-anchor="middle" font-size="12" font-weight="400"
      fill="#52707A" font-family="Carlito">active ≠ false,</text><text x="1030" y="422.81999999999994" text-anchor="middle" font-size="12" font-weight="400"
      fill="#52707A" font-family="Carlito">valid role?</text><rect x="860" y="130" width="350" height="120" rx="10" fill="#DFF1E8" stroke="#2F7D5B" stroke-width="2"/><rect x="860" y="130" width="6" height="120" rx="3" fill="#2F7D5B"/><text x="1035" y="166.45" text-anchor="middle" font-size="15" font-weight="700"
      fill="#22404A" font-family="Carlito">App starts (boot)</text><text x="1035" y="185.64999999999998" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">update lastLogin · load users list</text><text x="1035" y="204.85" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">open live listeners · render route</text><text x="1035" y="224.04999999999998" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">menus shown per role</text><path d="M770,200 L860,200" fill="none" stroke="#2F7D5B" stroke-width="2"  marker-end="url(#a-ok)" /><path d="M1030,335 L1030,250" fill="none" stroke="#2F7D5B" stroke-width="2"  marker-end="url(#a-ok)" /><rect x="933" y="280.875" width="194" height="22.25" rx="5" fill="#fff" fill-opacity="0.95"/><text x="1030" y="294.875" text-anchor="middle" font-size="13" fill="#2F7D5B" font-family="Carlito" font-weight="700">yes → admin / staff / viewer</text><path d="M1030,465 L1030,520" fill="none" stroke="#B5462F" stroke-width="2"  marker-end="url(#a-red)" /><rect x="1042.5" y="480.875" width="25" height="22.25" rx="5" fill="#fff" fill-opacity="0.95"/><text x="1055" y="494.875" text-anchor="middle" font-size="13" fill="#B5462F" font-family="Carlito" font-weight="700">no</text><rect x="900" y="520" width="260" height="90" rx="10" fill="#FBE3DE" stroke="#B5462F" stroke-width="2"/><text x="1030" y="551.05" text-anchor="middle" font-size="15" font-weight="700"
      fill="#22404A" font-family="Carlito">“No access yet” screen</text><text x="1030" y="570.25" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">Ask an admin to add you</text><text x="1030" y="589.4499999999999" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">→ Use a different account</text><rect x="40" y="520" width="560" height="90" rx="10" fill="#FCEFD2" stroke="#946200" stroke-width="2"/><text x="320" y="551.05" text-anchor="middle" font-size="15" font-weight="700"
      fill="#22404A" font-family="Carlito">Security Rules (server side)</text><text x="320" y="570.25" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">Every read and write carries the user's ID token; the rules</text><text x="320" y="589.4499999999999" text-anchor="middle" font-size="13" font-weight="400"
      fill="#52707A" font-family="Carlito">re-check the role in users/{email} before allowing it.</text><text x="620" y="668" text-anchor="middle" font-size="14" font-weight="400"
      fill="#22404A" font-family="Carlito">The app's role check decides what is shown; the Security Rules decide what is allowed. Both use the same users/{email} document.</text></svg>