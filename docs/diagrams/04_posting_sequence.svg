    <text x="502" y="384" font-size="13" font-weight="700" fill="#FF7235" font-family="Carlito">runTransaction — all or nothing, auto-retry on conflict</text><circle cx="30" cy="140" r="13" fill="#FF7235"/><text x="30" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Carlito">1</text><path d="M116,140 L354,140" fill="none" stroke="#22404A" stroke-width="2"  marker-end="url(#a-ink)" /><rect x="112" y="114.875" width="246" height="22.25" rx="5" fill="#fff" fill-opacity="0.95"/><text x="235" y="128.875" text-anchor="middle" font-size="13" fill="#22404A" font-family="Carlito" font-weight="400">fill form: item, qty, party, purpose</text><rect x="250" y="164" width="220" height="46" rx="10" fill="#E1EFF3" stroke="#1E7FA3" stroke-width="2"/><text x="360" y="183.23000000000002" text-anchor="middle" font-size="13" font-weight="700"
      fill="#22404A" font-family="Carlito">validate: qty &gt; 0, date ≤ today</text><text x="360" y="199.87" text-anchor="middle" font-size="11" font-weight="400"
