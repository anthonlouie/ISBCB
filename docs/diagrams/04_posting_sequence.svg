l="#fff" fill-opacity="0.95"/><text x="750" y="454.875" text-anchor="middle" font-size="13" fill="#1E7FA3" font-family="Carlito" font-weight="400">cur, cost, min</text><rect x="510" y="490" width="220" height="66" rx="10" fill="#FCEFD2" stroke="#946200" stroke-width="2"/><text x="620" y="510.91" text-anchor="middle" font-size="13" font-weight="700"
