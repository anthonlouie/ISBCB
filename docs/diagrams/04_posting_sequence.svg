      fill="#52707A" font-family="Carlito">abort if bal &lt; 0 · flag unusual</text><text x="620" y="544.19" text-anchor="middle" font-size="11" font-weight="400"
      fill="#52707A" font-family="Carlito">weighted-average cost (IN)</text><path d="M626,590 L874,590" fill="none" stroke="#FF7235" stroke-width="2"  marker-end="url(#a-orange)" /><rect x="607.5" y="564.875" width="285" height="22.25" rx="5" fill="#fff" fill-opacity="0.95"/><text x="750" y="578.875" text-anchor="middle" font-size="13" fill="#FF7235" font-family="Carlito" font-weight="400">tx.set(ledger/{day}_{email}) entries.{txn}</text><path d="M626,636 L874,636" fill="none" stroke="#FF7235" stroke-width="2"  marker-end="url(#a-orange)" /><rect x="623.75" y="610.875" width="252.5" height="22.25" rx="5" fill="#fff" fill-opacity="0.95"/><text x="750" y="624.875" text-anchor="middle" font-size="13" fill="#FF7235" font-family="Carlito" font-weight="400">tx.update(items/{id}) cur = bal, cost</text><rect x="770" y="660" width="220" height="50" rx="10" fill="#FCF5EF" stroke="#FF7235" stroke-width="2"/><text x="880" y="681.2299999999999" text-anchor="middle" font-size="13" font-weight="700"
      fill="#22404A" font-family="Carlito">Security Rules check role</text><text x="880" y="697.8699999999999" text-anchor="middle" font-size="11" font-weight="400"
