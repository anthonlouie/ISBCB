    <text x="36" y="344" font-size="14" font-weight="700" fill="#186F90" font-family="Carlito" letter-spacing="0.6">ADMINISTRATOR</text><rect x="50" y="140" width="180" height="60" rx="30" fill="#FFFFFF" stroke="#C9DCE2" stroke-width="2"/><text x="140" y="165.65" text-anchor="middle" font-size="15" font-weight="700"
