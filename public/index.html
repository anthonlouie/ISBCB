<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BCB-Berkeley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail navigation + working canvas.
   Palette: sky blue #6DB5CA, mist #B8D8E0, cream #FCF5EF, tangerine #FF7235 (Stock Out / calls to action).
   Text and chart tones are deepened from the same hues where the swatches are too pale to read. */
:root {
  --bg: #FCF5EF; --surface: #FFFDFB; --sunk: #EAF3F5; --zebra: #FAF6F2; --line: #DCE7EA; --fg: #22404A; --muted: #52707A;
  --accent: #186F90; --accent-ink: #FFFFFF; --accent-soft: #E1EFF3; --chart1: #1E85AD;
  --in: #1E85AD; --in-btn: #18749A; --in-ink: #FFFFFF; --out: #FF7235; --out-ink: #2B1407; --btn-ink: #FFFFFF; --adj: #7A64A8;
  --ok: #2F7D5B; --ok-bg: #DFF1E8; --warn: #946200; --warn-bg: #FCEFD2; --bad: #B0352A; --bad-bg: #FBE3E0;
  --info: #1E6E8C; --info-bg: #DCEDF2; --scrim: #22404A;
  --font-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 12px; --row: 11px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #142328; --surface: #1B2E34; --sunk: #20363D; --zebra: #182A30; --line: #2D474F; --fg: #E9F1F2; --muted: #9DB5BC;
  --accent: #6DB5CA; --accent-ink: #0F1E22; --accent-soft: #21414A; --chart1: #6DB5CA;
  --in: #3C9DC4; --in-btn: #3C9DC4; --in-ink: #0F1E22; --out: #FF7235; --out-ink: #2B1407; --btn-ink: #0F1E22; --adj: #B3A2DA;
  --ok: #7DCCA4; --ok-bg: #1C3A2F; --warn: #E9BE62; --warn-bg: #3A3220; --bad: #F2877C; --bad-bg: #44241F;
  --info: #B8D8E0; --info-bg: #21414A; --scrim: #0A1417; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #142328; --surface: #1B2E34; --sunk: #20363D; --zebra: #182A30; --line: #2D474F; --fg: #E9F1F2; --muted: #9DB5BC;
  --accent: #6DB5CA; --accent-ink: #0F1E22; --accent-soft: #21414A; --chart1: #6DB5CA;
  --in: #3C9DC4; --in-btn: #3C9DC4; --in-ink: #0F1E22; --out: #FF7235; --out-ink: #2B1407; --btn-ink: #0F1E22; --adj: #B3A2DA;
  --ok: #7DCCA4; --ok-bg: #1C3A2F; --warn: #E9BE62; --warn-bg: #3A3220; --bad: #F2877C; --bad-bg: #44241F;
  --info: #B8D8E0; --info-bg: #21414A; --scrim: #0A1417; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font-ui); }
body.compact { font-size: 14px; line-height: 1.45; --row: 5px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 700; }
h1 { font-size: 23px; letter-spacing: -.01em; }
h2 { font-size: 15.5px; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono, .sku { font-family: var(--font-mono); font-size: .86em; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nowrap { white-space: nowrap; }

.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding-block: 18px; padding-inline: 12px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 10px 16px; margin-bottom: 8px; }
.brand b { font-size: 17px; font-weight: 700; }
.brand span { font-size: 12.5px; color: var(--muted); }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail nav a { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 10px; color: var(--fg); text-decoration: none; font-weight: 500; }
.rail nav a:hover { background: var(--sunk); }
.rail nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.rail .who { margin-top: 18px; padding: 10px; border-radius: 10px; background: var(--sunk); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
.rail .who img { width: 28px; height: 28px; border-radius: 50%; }
.rail .who .who-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail .signout { width: 100%; margin-top: 8px; }
.prefs { margin-top: auto; padding: 14px 4px 4px; display: grid; gap: 10px; }
.prefs .lbl { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.seg { display: flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 7px; padding: 5px 6px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent); }
main { padding-block: 24px 64px; padding-inline: 28px; min-width: 0; }
.topbar, .bottombar { display: none; }

.head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
.head .sub { color: var(--muted); margin-top: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.grid2 > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; min-width: 0; }
.card > h2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
.card.filters { border-color: transparent; background: var(--sunk); padding: 14px 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .seg button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.in { background: var(--in-btn); border-color: var(--in-btn); color: var(--in-ink); }
.btn.out { background: var(--out); border-color: var(--out); color: var(--out-ink); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn.lg { padding: 11px 20px; font-size: 15.5px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi { text-align: left; background: var(--surface); border: 0; border-radius: var(--radius); padding: 16px 18px; cursor: pointer; box-shadow: 0 1px 2px color-mix(in srgb, var(--fg) 6%, transparent); }
.kpi:hover { background: var(--accent-soft); }
.kpi .l { font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .v { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi.warn .v { color: var(--warn); } .kpi.bad .v { color: var(--bad); }
.alerts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.alert { border: 0; padding: 7px 13px; border-radius: 999px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.info { background: var(--info-bg); color: var(--info); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill .ic { font-size: 10.5px; line-height: 1; }
.pill.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.st-Normal, .st-Active, .st-POSTED { background: var(--ok-bg); color: var(--ok); }
.st-Low { background: var(--warn-bg); color: var(--warn); }
.st-Out, .st-REJECTED { background: var(--bad-bg); color: var(--bad); }
.st-PENDING { background: var(--warn-bg); color: var(--warn); }
.st-Inactive, .st-REVERSED { background: var(--sunk); color: var(--muted); }
.t-IN { background: color-mix(in srgb, var(--in) 14%, transparent); color: var(--in); }
.t-OUT { background: color-mix(in srgb, var(--out) 14%, transparent); color: var(--out); }
.t-ADJ { background: color-mix(in srgb, var(--adj) 14%, transparent); color: var(--adj); }
.t-REV { background: var(--sunk); color: var(--muted); }
.t-OPEN { background: var(--info-bg); color: var(--info); }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: var(--row) 10px; text-align: left; vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--line); padding-block: 8px; }
tbody tr:nth-child(even) td { background: var(--zebra); }
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]::after { content: " ↕"; opacity: .3; }
th.asc::after { content: " ↑"; opacity: 1; } th.desc::after { content: " ↓"; opacity: 1; }
tbody tr:hover td { background: var(--accent-soft); }
tr.grp td { background: var(--accent-soft) !important; color: var(--accent); font-weight: 650; }
tr.sub td, tfoot td { font-weight: 650; background: var(--sunk) !important; }
tr.dim td { color: var(--muted); }
td.empty { text-align: center; color: var(--muted); padding: 30px; }
.clickrow { cursor: pointer; }

.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.filters > div { flex: 1 1 150px; min-width: 0; }
.filters > div.w { flex: 2 1 230px; }
.filters label { font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
.form .full { grid-column: 1 / -1; }
.form label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 5px; }
.req { color: var(--bad); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.card.filters input, .card.filters select { background: var(--surface); border-color: transparent; }
input[readonly] { background: var(--sunk); border-color: transparent; }
textarea { min-height: 68px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.invalid { border-color: var(--bad) !important; }
.field-error { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: 5px; }
.form-error { color: var(--bad); background: var(--bad-bg); border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: 13.5px; margin-top: 14px; }
.stepper { display: flex; gap: 6px; }
.stepper input { text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper button { flex: 0 0 46px; border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; font-size: 20px; cursor: pointer; color: var(--fg); }
.stepper button:hover { background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chips .lbl { font-size: 12px; color: var(--muted); align-self: center; margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; color: var(--fg); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { background: var(--accent-soft); border-color: transparent; }

.panel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px; border-radius: 10px; background: var(--accent-soft); }
.panel.warn { background: var(--warn-bg); } .panel.bad { background: var(--bad-bg); }
.panel .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.panel .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.panel .msg { grid-column: 1 / -1; font-size: 13px; font-weight: 600; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 0; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; }
.chart { position: relative; height: 270px; }
.pager { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.reports { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 14px; }
.reports button { text-align: left; background: var(--surface); border: 0; border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: 0 1px 2px color-mix(in srgb, var(--fg) 6%, transparent); }
.reports button:hover { background: var(--accent-soft); }
.reports b { display: block; color: var(--accent); margin-bottom: 3px; font-weight: 650; }
.meta { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.title-links { font-size: 12.5px; font-weight: 500; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.title-links button, .linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
.linkbtn { font-size: 12.5px; }

.toast { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: min(440px, calc(100vw - 32px)); }
.toast div { padding: 11px 15px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 24px color-mix(in srgb, var(--fg) 16%, transparent); }
.toast .ok { background: var(--ok-bg); color: var(--ok); } .toast .err { background: var(--bad-bg); color: var(--bad); } .toast .warn { background: var(--warn-bg); color: var(--warn); }
.overlay { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--scrim) 45%, transparent); display: flex; justify-content: flex-end; }
.drawer { width: min(720px, 100%); height: 100%; overflow-y: auto; background: var(--bg); padding-block: calc(20px + env(safe-area-inset-top, 0px)) 40px; padding-inline: 22px; }
.banner { padding: 12px 16px; border-radius: 10px; background: var(--info-bg); color: var(--info); margin-bottom: 16px; }

#conn { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: 13.5px; padding: 7px 14px; border-radius: 999px; box-shadow: 0 4px 16px color-mix(in srgb, var(--scrim) 18%, transparent); max-width: calc(100vw - 32px); }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: 256px; transform: translateX(-100%); transition: transform .18s; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  body.nav .rail { transform: none; box-shadow: 4px 0 24px color-mix(in srgb, var(--scrim) 25%, transparent); }
  .topbar { display: flex; gap: 10px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 16px; }
  .topbar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.can-write .bottombar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  body.can-write main { padding-bottom: 96px; }
  body.can-write .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .head .quick { display: none; }
  main { padding-inline: 16px; padding-top: 18px; }
  .grid2, .form { grid-template-columns: minmax(0, 1fr); }
  .filters { gap: 10px; }
  .filters > div, .filters > div.w { flex: 1 1 calc(50% - 5px); }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } * { scroll-behavior: auto !important; } }
</style>
<script src="firebase-config.js"></script>
<script>window.__fbReady = new Promise(r => { window.__resolveFb = r; });
window.claude = { use: async name => (await window.__fbReady)(name) };</script>
<script type="module" src="firebase-shim.js"></script>

<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand"><b id="brandName">BCB-Berkeley</b><span>Inventory management</span></div>
    <nav id="nav"></nav>
    <div class="who" id="who"><span class="muted">Connecting…</span></div>
    <button type="button" class="btn sm signout" id="signout" data-act="signout" hidden>Sign out</button>
    <div class="prefs">
      <div><div class="lbl" id="lbl-theme">Theme</div><div class="seg" role="group" aria-labelledby="lbl-theme"><button type="button" data-pref="theme" data-v="auto">Auto</button><button type="button" data-pref="theme" data-v="light">Light</button><button type="button" data-pref="theme" data-v="dark">Dark</button></div></div>
      <div><div class="lbl" id="lbl-density">Density</div><div class="seg" role="group" aria-labelledby="lbl-density"><button type="button" data-pref="density" data-v="comfortable">Comfortable</button><button type="button" data-pref="density" data-v="compact">Compact</button></div></div>
    </div>
  </aside>
  <div style="min-width:0">
    <div class="topbar"><button class="btn sm" id="menuBtn" aria-label="Open menu">☰</button><b id="topName">BCB-Berkeley</b><button type="button" class="btn sm" id="signout-top" data-act="signout" hidden aria-label="Sign out">Sign out</button></div>
    <main id="main"><div class="card"><h2>Loading inventory…</h2><p class="muted">Connecting to the shared inventory database.</p></div></main>
  </div>
</div>
<nav class="bottombar" aria-label="Quick actions"><a class="btn lg in" href="#stock-in">+ Stock In</a><a class="btn lg out" href="#stock-out">− Stock Out</a></nav>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<script>
(() => {
"use strict";
/* ============================================================ state */
const TAB = "tab-" + Math.random().toString(36).slice(2, 10);
const S = {
  db: null, user: null, downloads: null, uid: null, me: null, role: "viewer", connected: false,
  items: new Map(), lists: { categories: {}, locations: {}, suppliers: {}, units: [] },
  settings: { company: "BCB-Berkeley", costOn: true, approval: true, unusualPct: 50, unusualQty: 0, replenish: 2 },
  ledgerDocs: new Map(), entries: [], byId: new Map(), adjustments: new Map(),
  loaded: { items: false, ledger: false }, profiles: {},
  route: "dashboard", f: {}, sort: {}, page: {}, review: null, modal: null, busy: false,
  windowStart: null, extraFrom: null,
};
const REASONS = ["Physical count", "Damaged", "Lost / missing", "Expired / spoiled", "Data-entry error", "Other"];
const TYPE = { OPEN: "Opening balance", IN: "Stock In", OUT: "Stock Out", ADJ: "Adjustment", REV: "Reversal" };
const ROLE = { admin: "Administrator", staff: "Inventory Staff", viewer: "Viewer / Manager" };
const ROUTES = [["dashboard", "Dashboard"], ["items", "Inventory Items"], ["stock-in", "Stock In"], ["stock-out", "Stock Out"],
  ["adjustments", "Stock Adjustments"], ["history", "Movement History"], ["reports", "Reports"], ["people", "User Access"], ["settings", "Settings"]];
const VIEWS = {};
const FORM_ROUTES = new Set(["stock-in", "stock-out", "adjust-new", "item-new", "import"]);

/* ============================================================ helpers */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r3 = n => Math.round(n * 1000) / 1000;
const qty = n => n == null || n === "" ? "" : Number(n).toLocaleString(undefined, { maximumFractionDigits: 3 });
const money = n => n == null || n === "" ? "" : Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, "0");
const localDay = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (day, n) => { const d = new Date(day + "T12:00:00"); d.setDate(d.getDate() + n); return localDay(d); };
const monthStart = (back = 0) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - back); return localDay(d); };

function toast(msg, kind = "ok", ms = 4200) { // one message at a time; a new one replaces the last

function parseQty(v, label, allowZero = false) {
  const n = Number(String(v ?? "").replace(/,/g, "").trim());
  if (String(v ?? "").trim() === "" || !isFinite(n)) throw new Error(`${label} must be a number.`);
  if (n < 0 || (!allowZero && n === 0)) throw new Error(allowZero ? `${label} cannot be negative.` : `${label} must be greater than zero.`);
  if (n > 1e9) throw new Error(`${label} is too large.`);
  return r3(n);
}
function parseCost(v) {
  if (v == null || String(v).trim() === "") return null;
  const n = Number(String(v).replace(/,/g, ""));
  if (!isFinite(n) || n < 0) throw new Error("Unit cost cannot be negative.");
  return Math.round(n * 10000) / 10000;
}
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => { o[k] = typeof v === "string" ? v.trim() : v; }); return o; }

/* ============================================================ database writes */
async function withLease(ref, fn) {
  for (let i = 0; i < 8; i++) {
    const r = await ref.acquire({ holder: TAB, ttlMs: 3000 });
    if (r.acquired) return fn();
    const wait = r.expiresAt ? Date.parse(r.expiresAt) - Date.now() + 80 : 400;
    await sleep(Math.min(3200, Math.max(150, wait)));
  }
  throw new Error("Someone else is updating this record right now. Try again in a few seconds.");
}
function errText(e) {
  if (e?.code === "invalid_argument") return "You don't have permission to change inventory data, or the data was rejected.";
  if (e?.code === "quota_exceeded") return "The inventory database is full. Export a backup and archive old history.";
  if (e?.code === "resource_exhausted") return "Too many requests at once. Wait a moment and try again.";
  return e?.message || "Something went wrong.";
}
// Append one entry to this person's daily document (ledger or audit). Entries merge by key, so
// two tabs never overwrite each other and retrying the same entry id is harmless.
async function appendEntry(coll, entry) {
  const day = localDay();
  const ref = S.db.doc(`${coll}/${day}_${S.uid || "anon"}`);
  const body = { day, uid: S.uid, entries: { [entry.id]: entry } }; // day + uid on every write: the security rules check them
  try { await ref.update(body); }
  catch (e) {
    if (e?.code !== "invalid_argument") throw e;
    await withLease(ref, async () => {
      const snap = await ref.get();
      if (snap.exists) await ref.update(body);
      else await ref.set({ day, uid: S.uid, entries: { [entry.id]: entry } });
    });
  }
  return ref.id;
}
async function audit(action, detail) {
  try { await appendEntry("audit", { id: rid(8), ts: new Date().toISOString(), action, detail: detail || {}, uid: S.uid }); }
  catch (e) { console.warn("audit failed", e); }
}
// The single path for every stock change. One transaction: re-read the item, check, write the ledger entry
// and the new balance together, so they can never disagree.
async function post({ itemId, type, qty: q, dir, date, cost, party, purpose, ref: refNo, by, remarks, id, extra }) {
  if (S.byId.has(id)) throw new Error(`This form was already saved as ${id}.`);
  return S.db.transaction(async tx => {
    const snap = await tx.get("items/" + itemId);
    if (!snap.exists) throw new Error("Item not found.");
    const it = snap.data();
    const bal = r3((it.cur || 0) + dir * q);
    if (bal < 0) throw new Error(`Not enough stock for ${it.name}: ${qty(it.cur)} ${it.uom} available, ${qty(q)} requested.`);
    const ts = new Date().toISOString();
    let unusual = false;
    if (type === "IN" || type === "OUT") {
      const pct = Number(S.settings.unusualPct) || 0, lim = Number(S.settings.unusualQty) || 0;
      unusual = (lim > 0 && q > lim) || (dir < 0 && pct > 0 && it.cur > 0 && q > it.cur * pct / 100);
    }
    const entry = { id, type, date: date || localDay(), ts, item: itemId, sku: it.sku, name: it.name, uom: it.uom,
      qin: dir > 0 ? q : 0, qout: dir < 0 ? q : 0, bal, cost: cost ?? it.cost ?? null, party: party || "", purpose: purpose || "",
      ref: refNo || "", by: by || "", remarks: remarks || "", uid: S.uid, unusual, ...(extra || {}) };
    const upd = { cur: bal, updatedAt: ts, updatedBy: S.uid };
    if (type === "IN" && cost != null) upd.cost = (it.cost == null || it.cur <= 0) ? cost : Math.round(((it.cur * it.cost) + q * cost) / bal * 10000) / 10000;
    const day = localDay();
    tx.set(`ledger/${day}_${S.uid}`, { day, uid: S.uid, entries: { [entry.id]: entry } }, true);
    tx.update("items/" + itemId, upd);
    return entry;
  });
}

/* ============================================================ subscriptions */
function rebuildEntries() {
  const all = [];
  for (const [docId, d] of S.ledgerDocs) for (const e of Object.values(d.entries || {})) all.push({ ...e, doc: docId });
  all.sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : a.id < b.id ? -1 : 1);
  S.entries = all; S.byId = new Map(all.map(e => [e.id, e]));
}
// Live feeds. A feed can end (device sleep, network drop, background tab); each one reconnects on its
// own with backoff, and again whenever the tab becomes visible or the network returns.
const FEEDS = new Map();
function live(name, build, onData) {
  const feed = { name, build, onData, unsub: null, tries: 0, timer: null, ok: false };
  FEEDS.set(name, feed);
  connectFeed(feed);
}
function connectFeed(feed) {
  clearTimeout(feed.timer);
  try { feed.unsub?.(); } catch {}
  feed.unsub = feed.build().onSnapshot(snap => {
    feed.tries = 0; feed.ok = true; feed.onData(snap); showConnection();
  }, e => {
    feed.ok = false; feed.unsub = null; showConnection();
    if (e?.code === "revoked" || e?.code === "not_granted") { showConnection("Your access to this inventory changed. Reload the page."); return; }
    const wait = Math.min(30000, 1500 * 2 ** feed.tries++) + Math.random() * 500;
    console.warn(`feed ${feed.name} ended (${e?.code}); reconnecting in ${Math.round(wait)}ms`);
    feed.timer = setTimeout(() => connectFeed(feed), wait);
  });
}
function reconnectAll() { for (const f of FEEDS.values()) if (!f.ok) { f.tries = 0; connectFeed(f); } }
addEventListener("online", reconnectAll);
document.addEventListener("visibilitychange", () => { if (!document.hidden) reconnectAll(); });
function showConnection(msg) {
  const down = [...FEEDS.values()].some(f => !f.ok && f.unsub === null);
  let el = $("#conn");
  if (!el) { el = document.createElement("div"); el.id = "conn"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg || (down ? "Reconnecting to the inventory… changes you save are still kept." : "");
  el.hidden = !msg && !down;
}
function subscribe() {
  const db = S.db;
  S.windowStart = addDays(localDay(), -400);
  live("items", () => db.collection("items").limit(1000), snap => {
    S.items = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); S.loaded.items = true; changed();
  });
  live("lists", () => db.doc("config/lists"), s => { if (s.exists) S.lists = { categories: {}, locations: {}, suppliers: {}, units: [], ...s.data() }; changed(); });
  live("settings", () => db.doc("config/settings"), s => {
    if (s.exists) S.settings = { ...S.settings, ...s.data() };
    $("#brandName").textContent = S.settings.company; $("#topName").textContent = S.settings.company; changed();
  });
  live("ledger", () => db.collection("ledger").where("day", ">=", S.windowStart).limit(1000), snap => {
    // Replace the live window wholesale (a reconnect delivers the full set again); keep older days fetched on demand.
    for (const [id, d] of S.ledgerDocs) if ((d.day || "") >= S.windowStart) S.ledgerDocs.delete(id);
    for (const d of snap.docs) S.ledgerDocs.set(d.id, d.data());
    rebuildEntries(); S.loaded.ledger = true; changed();
  });
  live("users", () => db.collection("users").limit(500), snap => {
    S.people = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); S.profiles = Object.fromEntries([...S.people].map(([k, v]) => [k, { name: v.name || k }])); changed();
  });
  live("adjustments", () => db.collection("adjustments").limit(1000), snap => {
    S.adjustments = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); changed();
  });
}
async function ensureRange(from) { // fetch ledger days older than the live window when a filter asks for them
  if (!from || from >= S.windowStart || (S.extraFrom && from >= S.extraFrom)) return;
  const snap = await S.db.collection("ledger").where("day", ">=", from).where("day", "<", S.windowStart).limit(1000).get();
  snap.docs.forEach(d => S.ledgerDocs.set(d.id, d.data()));
  S.extraFrom = from; rebuildEntries(); changed();
}
let pending = false;
function changed() {
  if (pending) return; pending = true;
  requestAnimationFrame(() => { pending = false; resolvePeople().then(() => render(true)); });
}
async function resolvePeople() {
  if (!S.user) return;
  const ids = new Set();
  for (const e of S.entries) if (e.uid) ids.add(e.uid);
  for (const a of S.adjustments.values()) { if (a.by) ids.add(a.by); if (a.approvedBy) ids.add(a.approvedBy); }
  for (const i of S.items.values()) { if (i.createdBy) ids.add(i.createdBy); if (i.updatedBy) ids.add(i.updatedBy); }
  if (S.uid) ids.add(S.uid);
  try { Object.assign(S.profiles, await S.user.profiles([...ids])); } catch { /* names stay generic */ }
}

/* ============================================================ rendering */
function render(fromData = false) {
  renderNav();
  const r = S.route;
  // Forms are rendered once their lookups have loaded; after that, live data only refreshes their side panels.
  const stamp = `${r}|${S.items.size > 0}|${Object.keys(S.lists.categories).length > 0}`;
  if (fromData && (FORM_ROUTES.has(r) || S.review) && S.formStamp === stamp) { refreshLive(); renderModal(true); return; }
  S.formStamp = stamp;
  if (!S.connected) return;
  const main = $("#main");
  const focus = document.activeElement?.id, selStart = document.activeElement?.selectionStart;
  const kept = new Map();
  if (fromData) main.querySelectorAll("input,select,textarea").forEach(el => { if (el.type !== "file") kept.set(fieldKey(el), el.type === "checkbox" ? el.checked : el.value); });
  main.innerHTML = (VIEWS[r] || VIEWS.dashboard)();
  if (fromData) main.querySelectorAll("input,select,textarea").forEach(el => { const k = fieldKey(el); if (el.type !== "file" && kept.has(k)) { if (el.type === "checkbox") el.checked = kept.get(k); else el.value = kept.get(k); } });
  afterRender[r]?.();
  if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch {} } }
  renderModal(fromData);
}
function fieldKey(el) { const f = el.closest("form"); return el.id || `${f?.dataset.form || f?.dataset.filter || ""}:${f?.dataset.kind || ""}:${el.name}`; }
function renderNav() {

/* ---------------- dashboard */
function dashData(f) {
  const inScope = it => (!f.cat || it.cat === f.cat) && (!f.loc || it.loc === f.loc) && (!f.item || it.id === f.item);
  const items = activeItems().filter(inScope);
  const ids = new Set(items.map(i => i.id));
  const ents = S.entries.filter(e => ids.has(e.item) || (f.item && e.item === f.item));
  return { items, ents };
}
const afterRender = {};
VIEWS.dashboard = () => {
  const f = S.f.dashboard ||= { from: monthStart(5), to: localDay() };
  const { items, ents } = dashData(f);
  const m0 = monthStart(0), today = localDay();
  const low = items.filter(i => i.cur > 0 && i.cur <= i.min), out = items.filter(i => i.cur <= 0);
  const totalQty = items.reduce((s, i) => s + (i.cur || 0), 0), totalVal = items.reduce((s, i) => s + (i.cur || 0) * (i.cost || 0), 0);
  const inMonth = ents.filter(e => e.type === "IN" && e.date >= m0).length, outMonth = ents.filter(e => e.type === "OUT" && e.date >= m0).length;
  const pend = pendingAdj(), weekAgo = addDays(today, -7), unusual = ents.filter(e => e.unusual && e.date >= weekAgo);

VIEWS["item-new"] = () => canWrite() ? head("New item", "Fields marked * are required.") + itemForm(null) : denied();
function validateItem(d, existingId) {
  if (!d.name) throw new Error("Item name is required.");
  if (!d.cat || !S.lists.categories[d.cat]) throw new Error("Choose a category.");
  if (!d.uom) throw new Error("Unit of measurement is required.");
  let sku = (d.sku || "").toUpperCase();
  if (sku && !/^[A-Z0-9][A-Z0-9._/-]{0,39}$/.test(sku)) throw new Error("SKU may use letters, numbers, '.', '_', '/', '-'.");
  if (!sku) sku = nextSku(d.cat);
  for (const i of S.items.values()) {
    if (i.id !== existingId && i.sku.toUpperCase() === sku) throw new Error(`SKU ${sku} is already used by ${i.name}.`);
    if (d.barcode && i.id !== existingId && i.barcode === d.barcode) throw new Error(`Barcode is already used by ${i.name}.`);
  }
  return { sku, name: d.name.slice(0, 200), cat: d.cat, desc: d.desc || "", uom: d.uom, min: parseQty(d.min || 0, "Minimum stock", true),
    loc: d.loc || null, sup: d.sup || null, cost: S.settings.costOn ? parseCost(d.cost) : undefined, barcode: d.barcode || "", status: d.status || "Active" };
}
function nextSku(cat) {
  const code = S.lists.categories[cat]?.code || "ITM";
  let max = 0; const re = new RegExp(`^${code}-(\\d+)$`, "i");
  for (const i of S.items.values()) { const m = re.exec(i.sku); if (m) max = Math.max(max, +m[1]); }
  return `${code}-${String(max + 1).padStart(3, "0")}`;
}
async function createItem(d, source = "form") {

  const ts = new Date().toISOString();
  const doc = { ...v, cost: v.cost ?? null, beg, cur: 0, createdAt: ts, createdBy: S.uid, updatedAt: ts, updatedBy: S.uid };
  await S.db.doc("items/" + id).set(doc);
  S.items.set(id, { id, ...doc });
  if (beg > 0) await post({ itemId: id, type: "OPEN", qty: beg, dir: 1, id: txnNo("OB"), remarks: `Beginning stock (${source})` });
  await audit("create_item", { sku: v.sku, name: v.name, source });
  return v.sku;
}

// Up to 6 items this person moved most recently (anyone's if they have none yet), one tap to pick.
function recentChips() {
  const seen = new Set(), picks = [];
  const mine = S.entries.filter(e => e.uid === S.uid && e.type !== "OPEN");
  for (const e of (mine.length ? mine : S.entries).slice().reverse()) {
    const it = S.items.get(e.item);
    if (!it || it.status !== "Active" || seen.has(e.item)) continue;
    seen.add(e.item); picks.push(it); if (picks.length === 6) break;
  }
  return picks.length ? `<div class="chips"><span class="lbl">Recent:</span>${picks.map(i => `<button type="button" class="chip" data-act="pick-item" data-id="${i.id}" title="${esc(i.sku)} — ${esc(i.name)}">${esc(i.name)}</button>`).join("")}</div>` : "";
}
function recentTable(recent, isIn) {
  return `<div class="tw"><table><thead><tr><th>Date</th><th>Txn</th><th>Item</th><th class="num">Qty</th><th>${isIn ? "Source" : "Issued to"}</th><th>Reference</th><th>${isIn ? "Received" : "Released"} by</th></tr></thead><tbody>
  ${recent.map(e => `<tr class="clickrow ${e.rev ? "dim" : ""}" data-txn="${e.id}"><td class="nowrap">${e.date}</td><td class="mono nowrap">${e.id}</td><td>${esc(e.sku)} — ${esc(e.name)}</td><td class="num">${qty(e.qin || e.qout)} ${esc(e.uom)}</td><td>${esc(e.party)}</td><td>${esc(e.ref)}</td><td>${esc(e.by)}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">No transactions yet.</td></tr>`}
  </tbody></table></div>`;
}
function panelHtml(itemId, q, dir, actual) {
  const i = S.items.get(itemId); if (!i) return "";
  let after, extra = "";
  if (actual !== undefined) { const a = parseFloat(actual); after = isNaN(a) ? i.cur : a; extra = `<div><div class="l">Adjustment</div><div class="v">${isNaN(a) ? "–" : (a - i.cur > 0 ? "+" : "") + qty(r3(a - i.cur))}</div></div>`; }
  else after = r3(i.cur + dir * (parseFloat(q) || 0));
  const cls = after < 0 ? "bad" : after <= i.min ? "warn" : "";
  const msg = after < 0 ? `Not enough stock: only ${qty(i.cur)} ${i.uom} available.` : after <= 0 ? "This leaves the item out of stock." : after <= i.min ? "Balance will be at or below the minimum level." : "";
  return `<div class="panel ${cls}"><div><div class="l">Available now</div><div class="v">${qty(i.cur)} ${esc(i.uom)}</div></div><div><div class="l">Minimum</div><div class="v">${qty(i.min)}</div></div>
    ${extra || `<div><div class="l">Balance after</div><div class="v">${qty(after)} ${esc(i.uom)}</div></div>`}${msg ? `<div class="msg">${msg}</div>` : ""}</div>`;
}
function refreshPanel() {
  const p = $("#s-panel"); if (!p) return;
  const item = $("#s-item")?.value, actual = $("#a-actual");
  p.innerHTML = panelHtml(item, $("#s-qty")?.value, S.route === "stock-in" ? 1 : -1, actual ? actual.value : undefined);
  const sys = $("#a-system"); if (sys) sys.value = S.items.get(item) ? qty(S.items.get(item).cur) : "";

afterRender["adjust-new"] = () => refreshPanel();
async function applyAdjustment(adjId, note) {
  const ref = S.db.doc("adjustments/" + adjId);
  return withLease(ref, async () => {
    const snap = await ref.get(); const a = snap.data();
    if (!a || a.status !== "PENDING") throw new Error("This adjustment is no longer pending.");
    const e = await post({ itemId: a.item, type: "ADJ", qty: Math.abs(a.delta), dir: a.delta > 0 ? 1 : -1, id: txnNo("SA"), ref: adjId, purpose: a.reason,
      remarks: `${a.reason}: system ${qty(a.system)} → actual ${qty(a.actual)}${a.remarks ? ". " + a.remarks : ""}`, extra: { adj: adjId } });
    await ref.update({ status: "POSTED", approvedBy: S.uid, approvedAt: new Date().toISOString(), note: note || "", txn: e.id });
    await audit("approve_adjustment", { adj: adjId, txn: e.id });
    return e;
  });
}

  <div class="card"><div class="tw"><table><thead><tr><th>Date / time</th><th>Txn</th><th>Item</th><th>Type</th><th class="num">In</th><th class="num">Out</th><th class="num">Running balance</th><th>Reference</th><th>Processed by</th><th>Remarks</th></tr></thead><tbody>
  ${rows.slice((p - 1) * size, p * size).map(e => `<tr class="clickrow ${e.rev ? "dim" : ""}" data-txn="${e.id}"><td class="nowrap">${e.date}<div class="small muted">posted ${new Date(e.ts).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}</div></td>
    <td class="mono nowrap">${e.id}${e.rev ? `<div>${pill("REVERSED")}</div>` : ""}${e.unusual ? `<div>${pill("Unusual", "st-Low")}</div>` : ""}</td><td><span class="sku">${esc(e.sku)}</span> ${esc(e.name)}<div class="small muted">${esc(catName(S.items.get(e.item)?.cat))}</div></td><td>${tpill(e.type)}</td>
    <td class="num">${e.qin ? qty(e.qin) : ""}</td><td class="num">${e.qout ? qty(e.qout) : ""}</td><td class="num"><b>${qty(e.bal)}</b> <span class="small muted">${esc(e.uom)}</span></td>
    <td>${esc(e.ref)}${e.party ? `<div class="small muted">${esc(e.party)}</div>` : ""}</td><td>${esc(who(e.uid))}${e.by ? `<div class="small muted">${e.type === "IN" ? "Received" : "Released"}: ${esc(e.by)}</div>` : ""}</td><td class="small">${esc(e.remarks)}</td></tr>`).join("") || `<tr><td colspan="10" class="empty">No movements match these filters.</td></tr>`}
  </tbody></table></div>${pager("history", rows.length, size)}</div>`;
};
function filterEntries(f) {
  const q = (f.q || "").toLowerCase();
  return S.entries.filter(e => (!f.from || e.date >= f.from) && (!f.to || e.date <= f.to) && (!f.item || e.item === f.item) &&
    (!f.cat || S.items.get(e.item)?.cat === f.cat) && (!f.loc || S.items.get(e.item)?.loc === f.loc) && (!f.type || e.type === f.type) && (!f.user || e.uid === f.user) && (!f.unusual || e.unusual) &&
    (!q || `${e.id} ${e.sku} ${e.name} ${e.ref} ${e.party} ${e.purpose} ${e.by} ${e.remarks} ${who(e.uid)}`.toLowerCase().includes(q)));
}

      else if (c === '"') q = true; else if (c === ",") { row.push(cell); cell = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; } else cell += c; }
    if (cell || row.length) { row.push(cell); rows.push(row); }
  } else if (name.endsWith(".xlsx")) {
    await loadScript(XLSX_SRC);
    const wb = XLSX.read(await file.arrayBuffer()); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
  } else throw new Error("Choose a .csv or .xlsx file.");
  rows = rows.filter(r => r.some(c => String(c).trim()));
  if (!rows.length) throw new Error("The file is empty.");
  const hdr = rows[0].map(h => String(h).trim().toLowerCase());
  for (const c of ["Item Name", "Category", "UoM"]) if (!hdr.includes(c.toLowerCase())) throw new Error(`Missing column "${c}". Use the template.`);
  return rows.slice(1).map(r => Object.fromEntries(IMPORT_COLS.map(c => [c, String(r[hdr.indexOf(c.toLowerCase())] ?? "").trim()])));
}

// "Contains" search: every typed word must appear somewhere in the SKU, name, category or barcode.
// The list is rebuilt (not hidden) so it also filters on iPhone/iPad Safari.
function filterItemSelect(input) {
  const sel = document.getElementById(input.dataset.itemsearch);
  const words = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const pool = itemsSorted().filter(i => i.status === "Active");
  // Rank: name starts with the search > a name word starts with it > name/SKU contains it > category/barcode only.
  const rank = i => {
    const name = i.name.toLowerCase(), own = `${i.sku} ${i.name}`.toLowerCase();
    const all = `${own} ${catName(i.cat)} ${i.barcode || ""}`.toLowerCase();
    if (!words.every(w => all.includes(w))) return -1;
    if (name.startsWith(words[0])) return 0;
    if (words.every(w => name.split(/[\s()/-]+/).some(t => t.startsWith(w)))) return 1;
    if (words.every(w => own.includes(w))) return 2;
    return 3;
  };
  const hits = words.length
    ? pool.map(i => [rank(i), i]).filter(([r]) => r >= 0).sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).map(([, i]) => i)
    : pool;
  const q = words.join(" ");
  const exact = hits.find(i => i.sku.toLowerCase() === q || (i.barcode && i.barcode.toLowerCase() === q));
  const prev = sel.value;
  sel.innerHTML = `<option value="">${hits.length ? (words.length ? `— ${hits.length} match${hits.length > 1 ? "es" : ""} —` : "— Select item —") : "— No items match —"}</option>` +
    hits.map(i => opt(i.id, `${i.sku} — ${i.name}`, prev)).join("");
  if (exact) sel.value = exact.id;
  else if (words.length && !hits.some(i => i.id === prev)) sel.value = hits[0]?.id || "";
  const count = input.parentElement.querySelector(".search-count");
  if (count) count.textContent = words.length ? `${hits.length} of ${pool.length} items match "${input.value.trim()}"` : "";
  sel.size = words.length && hits.length > 1 ? Math.min(hits.length + 1, 8) : 1;
  if (sel.value !== prev) refreshPanel();
}

  const el = ev.target;
  if (el.dataset.userRole && isAdmin()) {
    const email = el.dataset.userRole, role = el.value;
    S.db.doc("users/" + email).update({ role, updatedAt: new Date().toISOString(), updatedBy: S.uid })
      .then(() => { audit("change_role", { email, role }); toast(`${email} is now ${ROLE[role]}.`); })
      .catch(e => toast(errText(e), "err"));
    return;
  }
  if (el.id === "s-item") { el.size = 1; refreshPanel(); }
  const ff = el.closest("form[data-filter]");
  if (ff && el.type !== "search") applyFilter(ff);
});
async function applyFilter(form) {
  const key = form.dataset.filter, d = formData(form);
  form.querySelectorAll("input[type=checkbox][name]").forEach(cb => { d[cb.name] = cb.checked ? "1" : ""; });
  S.f[key] = { ...(S.f[key] || {}), ...d }; S.page[key] = 1;
  if (d.from) await ensureRange(d.from).catch(() => {});
  render();
}

// Errors appear under the field they belong to (or at the bottom of the form), not as pop-ups.
const FIELD_HINTS = [[/email/i, ["email"]], [/quantity|actual|can't issue|not enough/i, ["qty", "actual"]], [/issued to/i, ["party"]], [/received by|released by/i, ["by"]],
  [/item|stock for/i, ["item"]], [/reason|remarks/i, ["reason"]], [/item name/i, ["name"]], [/category/i, ["cat"]], [/unit of measurement/i, ["uom"]],
  [/sku/i, ["sku"]], [/barcode/i, ["barcode"]], [/date/i, ["date"]], [/cost/i, ["cost"]]];
function clearFieldError(el) { el.classList.remove("invalid"); el.closest("div")?.querySelector(":scope > .field-error")?.remove(); }
function showFormError(form, msg) {
  form.querySelectorAll(".field-error, .form-error").forEach(n => n.remove());
  form.querySelectorAll(".invalid").forEach(n => n.classList.remove("invalid"));
  let field = null;
  for (const [re, names] of FIELD_HINTS) if (re.test(msg)) { field = names.map(n => form.elements[n]).find(Boolean); if (field) break; }
  const box = document.createElement("div"); box.setAttribute("role", "alert"); box.textContent = msg;
  if (field && field.type !== "hidden") {
    box.className = "field-error"; field.classList.add("invalid");
    (field.closest(".stepper") || field).parentElement.appendChild(box); field.focus({ preventScroll: true });
    box.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else { box.className = "form-error"; form.appendChild(box); box.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}
document.addEventListener("input", ev => { if (ev.target.classList?.contains("invalid")) clearFieldError(ev.target); }, true);
document.addEventListener("change", ev => { if (ev.target.classList?.contains("invalid")) clearFieldError(ev.target); }, true);

document.addEventListener("submit", async ev => {
  const form = ev.target; if (!form.dataset.form) return;
  ev.preventDefault();
  if (form._busy) return; form._busy = true;
  const btn = form.querySelector("[type=submit]"); if (btn) btn.disabled = true;
  const d = formData(form), kind = form.dataset.form;
  try {
    if (kind === "stock-in") {
      S.f["stock-in"] = { ...S.f["stock-in"], ...d };
      const q = parseQty(d.qty, "Quantity received"); if (!d.item) throw new Error("Choose an item."); if (!d.by) throw new Error("Received By is required.");
      if (d.date > localDay()) throw new Error("Transaction date can't be in the future.");
      const it = S.items.get(d.item); if (it?.status !== "Active") throw new Error("That item is inactive.");
      const e = await post({ itemId: d.item, type: "IN", qty: q, dir: 1, id: S.f["stock-in"].token, date: d.date, cost: S.settings.costOn ? parseCost(d.cost) : null, party: d.party, ref: d.ref, by: d.by, remarks: d.remarks });
      toast(`Stock-in ${e.id} saved. New balance: ${qty(e.bal)} ${e.uom}.${e.unusual ? " Flagged as an unusual movement." : ""}`, e.unusual ? "warn" : "ok");
      if (d.party && isAdmin()) ensureListEntry("suppliers", d.party).catch(() => {});
      S.f["stock-in"] = { item: d.item, by: d.by, party: d.party }; render(); return;
    }
    if (kind === "stock-out") {
      S.f["stock-out"] = { ...S.f["stock-out"], ...d };
      const q = parseQty(d.qty, "Quantity issued"); if (!d.item) throw new Error("Choose an item.");
      if (!d.party) throw new Error("Issued To / Department is required."); if (!d.by) throw new Error("Released By is required.");
      if (d.date > localDay()) throw new Error("Transaction date can't be in the future.");
      const it = S.items.get(d.item); if (it?.status !== "Active") throw new Error("That item is inactive.");
      if (q > it.cur) throw new Error(`Can't issue ${qty(q)} ${it.uom} of ${it.name}: only ${qty(it.cur)} available.`);
      S.review = { ...d, qty: q, token: S.f["stock-out"].token }; render(); window.scrollTo(0, 0); return;
    }
    if (kind === "adjust-new") {
      S.f["adjust-new"] = { ...S.f["adjust-new"], ...d };
      const it = S.items.get(d.item); if (!it) throw new Error("Choose an item.");
      const actual = parseQty(d.actual, "Actual quantity", true);
      if (!REASONS.includes(d.reason)) throw new Error("Choose a reason."); if (d.reason === "Other" && !d.remarks) throw new Error("Describe the reason in Remarks.");
      const delta = r3(actual - it.cur); if (delta === 0) throw new Error("Actual quantity equals the system quantity; nothing to adjust.");
      const id = S.f["adjust-new"].token; if (S.adjustments.has(id)) throw new Error(`Already submitted as ${id}.`);
      await S.db.doc("adjustments/" + id).set({ item: it.id, system: it.cur, actual, delta, reason: d.reason, remarks: d.remarks || "", status: "PENDING", by: S.uid, at: new Date().toISOString() });
      await audit("request_adjustment", { adj: id, sku: it.sku, system: it.cur, actual, reason: d.reason });
      if (isAdmin() || !S.settings.approval) { const e = await applyAdjustment(id, "Auto-approved"); toast(`Adjustment ${id} posted as ${e.id}.`); }
      else toast(`Adjustment ${id} submitted for approval.`);
      S.f["adjust-new"] = {}; location.hash = "adjustments"; return;
    }
    if (kind === "item-new") { const sku = await createItem(d); toast(`Item ${sku} created.`); location.hash = "items"; return; }
    if (kind === "item-edit") {
      const id = form.dataset.id, old = S.items.get(id);
      if (!isAdmin()) d.status = old.status;
      const v = validateItem(d, id); if (v.cost === undefined) delete v.cost;
      const changes = Object.fromEntries(Object.entries(v).filter(([k, x]) => (old[k] ?? null) !== (x ?? null)).map(([k, x]) => [k, [old[k] ?? null, x]]));
      if (!Object.keys(changes).length) { toast("No changes to save.", "warn"); S.modal = { type: "item", id }; renderModal(); return; }
      await S.db.doc("items/" + id).update({ ...v, updatedAt: new Date().toISOString(), updatedBy: S.uid });
      await audit("update_item", { sku: v.sku, changes }); toast("Item updated."); S.modal = { type: "item", id }; renderModal(); return;
    }
    if (kind === "reverse") {
      if (!d.reason) throw new Error("Give a reason for the reversal.");
      const o = S.byId.get(form.dataset.id); if (!o || o.rev) throw new Error("This transaction was already reversed.");
      const e = await post({ itemId: o.item, type: "REV", qty: o.qin || o.qout, dir: o.qin ? -1 : 1, id: txnNo("RV"), cost: o.cost, ref: o.id, remarks: `Reversal of ${o.id}: ${d.reason}`, extra: { reverses: o.id } });
      await S.db.doc("ledger/" + o.doc).update({ entries: { [o.id]: { rev: e.id, revUid: S.uid, revTs: e.ts } } });
      await audit("reverse_transaction", { txn: o.id, reversal: e.id, reason: d.reason }); toast(`Reversal ${e.id} posted.`); S.modal = { type: "txn", id: o.id }; return;
    }
    if (kind === "reject") {
      const ref = S.db.doc("adjustments/" + form.dataset.id);
      await withLease(ref, async () => { const a = (await ref.get()).data(); if (a?.status !== "PENDING") throw new Error("This adjustment is no longer pending."); await ref.update({ status: "REJECTED", approvedBy: S.uid, approvedAt: new Date().toISOString(), note: d.note }); });
      await audit("reject_adjustment", { adj: form.dataset.id, note: d.note }); toast("Adjustment rejected."); return;
    }
    if (kind === "user-add") {
      const email = (d.email || "").toLowerCase().trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error("Enter a valid Google account email address.");
      if (!ROLE[d.role]) throw new Error("Choose a role.");
      const existing = S.people?.get(email);
      await S.db.doc("users/" + email).update({ email, name: d.name || existing?.name || "", role: d.role, active: true,
        ...(existing ? { updatedAt: new Date().toISOString(), updatedBy: S.uid } : { addedAt: new Date().toISOString(), addedBy: S.uid }) });
      await audit(existing ? "change_role" : "add_user", { email, role: d.role });
      toast(`${email} can now sign in as ${ROLE[d.role]}.`); form.reset(); return;
    }
    if (kind === "settings") {
      const nums = {}; for (const k of ["unusualPct", "unusualQty", "replenish"]) { const n = Number(d[k]); if (!isFinite(n) || n < 0) throw new Error("Thresholds must be zero or positive numbers."); nums[k] = n; }
      const next = { company: d.company || "BCB-Berkeley", costOn: !!d.costOn, approval: !!d.approval, ...nums };
      await S.db.doc("config/settings").set(next); await audit("update_settings", next); toast("Settings saved."); return;
    }
    if (kind === "list-add") {
      const k = form.dataset.kind; if (!d.name) throw new Error("Enter a name.");
      if (Object.values(S.lists[k]).some(v => v.name.toLowerCase() === d.name.toLowerCase())) throw new Error("That name already exists.");
      const id = k[0] + rid(5).toLowerCase(), entry = { name: d.name, active: true };
      if (k === "categories") { entry.code = (d.code || d.name.slice(0, 3)).toUpperCase(); if (Object.values(S.lists.categories).some(c => c.code === entry.code)) throw new Error("That category code is already used."); }
      await S.db.doc("config/lists").update({ [k]: { [id]: entry } }); await audit("create_" + k, entry); toast("Added."); return;
    }
    if (kind === "rename") {
      const k = form.dataset.kind, upd = { name: d.name }; if (d.code != null) upd.code = d.code.toUpperCase();
      await S.db.doc("config/lists").update({ [k]: { [form.dataset.id]: upd } }); await audit("rename_" + k, upd); toast("Renamed."); return;
    }
    if (kind === "import") {
      const file = form.querySelector("input[type=file]").files[0]; if (!file) throw new Error("Choose a file.");
      const rows = await readTable(file); let created = 0, skipped = 0; const errors = [];
      const box = $("#imp-result"); box.innerHTML = `<p class="muted">Importing ${rows.length} rows…</p>`;
      for (const [n, r] of rows.entries()) {
        try {
          if (r.SKU && [...S.items.values()].some(i => i.sku.toUpperCase() === r.SKU.toUpperCase())) { skipped++; continue; }
          const cat = await ensureListEntry("categories", r.Category); if (!cat) throw new Error(`Unknown category "${r.Category}"`);
          const loc = await ensureListEntry("locations", r["Storage Location"]), sup = await ensureListEntry("suppliers", r.Supplier);
          await createItem({ sku: r.SKU, name: r["Item Name"], cat, desc: r.Description, uom: r.UoM, beg: r["Beginning Stock"] || 0, min: r["Minimum Stock"] || 0, loc: loc || "", sup: sup || "", cost: r["Unit Cost"], status: /^inactive$/i.test(r.Status) ? "Inactive" : "Active" }, "import");
          created++; if (created % 10 === 0) box.innerHTML = `<p class="muted">Imported ${created} of ${rows.length}…</p>`;
        } catch (e) { errors.push(`Row ${n + 2}: ${errText(e)}`); }
      }
      box.innerHTML = `<p><b>${created} created</b>, ${skipped} skipped (SKU exists), ${errors.length} errors.</p>${errors.length ? `<ul class="small">${errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}`;
      toast(`Import finished: ${created} created.`, errors.length ? "warn" : "ok"); return;
    }
    if (kind === "restore") {
      if (d.confirm !== "RESTORE") throw new Error("Type RESTORE to confirm.");
      const data = JSON.parse(await form.querySelector("input[type=file]").files[0].text());
      if (!data || data.format !== "cafe-stockroom-backup" || !data.collections) throw new Error("That file isn't a backup from this app.");
      await restore(data); toast("Backup restored."); return;
    }
  } catch (e) { showFormError(form, errText(e)); if (kind === "stock-in" || kind === "stock-out" || kind === "adjust-new") refreshPanel(); }
  finally { form._busy = false; if (btn) btn.disabled = false; }
});

/* ============================================================ backup / restore */
async function readAll(coll) {
  const out = new Map(); let from = "0000";
  const daily = coll === "ledger" || coll === "audit";
  for (;;) { // daily collections page by their day field; the others stay under 1000 documents
    const q = daily ? S.db.collection(coll).where("day", ">=", from).orderBy("day").limit(1000) : S.db.collection(coll).limit(1000);
    const snap = await q.get(); snap.docs.forEach(d => out.set(d.id, d.data()));
    if (snap.size < 1000 || !daily) break;
    const next = snap.docs[snap.size - 1].data().day;
    if (next === from) break;
    from = next;
  }
  return [...out.entries()];
}
async function backup() {
  const collections = {};
  for (const c of ["items", "adjustments", "ledger", "audit"]) collections[c] = Object.fromEntries(await readAll(c));
  const cfg = {}; for (const k of ["lists", "settings"]) { const s = await S.db.doc("config/" + k).get(); if (s.exists) cfg[k] = s.data(); }
  collections.config = cfg;
  await audit("backup", { items: Object.keys(collections.items).length });
  await saveFile(`inventory_backup_${localDay().replace(/-/g, "")}.json`, JSON.stringify({ format: "cafe-stockroom-backup", version: 1, exportedAt: new Date().toISOString(), collections }));
}
async function restore(data) {
  for (const c of ["items", "adjustments", "ledger", "audit"]) {
    const keep = data.collections[c] || {};
    for (const [id] of await readAll(c)) if (!(id in keep)) await S.db.doc(`${c}/${id}`).delete();
    for (const [id, body] of Object.entries(keep)) await S.db.doc(`${c}/${id}`).set(body);
  }
  for (const [k, v] of Object.entries(data.collections.config || {})) await S.db.doc("config/" + k).set(v);
  await audit("restore", { exportedAt: data.exportedAt });
}

/* ============================================================ viewer preferences */
const HOST_THEME = document.documentElement.getAttribute("data-theme");
function readPref(k, d) { try { return localStorage.getItem("pref:" + k) || d; } catch { return d; } }
function setPref(k, v, save = true) {
  if (save) { try { localStorage.setItem("pref:" + k, v); } catch {} }
  if (k === "theme") { if (v === "auto") { if (HOST_THEME) document.documentElement.setAttribute("data-theme", HOST_THEME); else document.documentElement.removeAttribute("data-theme"); } else document.documentElement.setAttribute("data-theme", v); }
  if (k === "density") document.body.classList.toggle("compact", v === "compact");
  document.querySelectorAll(`[data-pref="${k}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  if (save && S.connected) render();
}
setPref("theme", readPref("theme", "auto"), false);
setPref("density", readPref("density", "comfortable"), false);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (S.connected && S.route === "dashboard") render(); });

/* ============================================================ boot */
async function boot() {
  const [db, user, downloads] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  S.db = db; S.user = user; S.downloads = downloads;
  if (!db) return;
  S.me = await user.me(); S.uid = S.me.id; S.role = S.me.role;
  S.connected = true; renderWho(); subscribe(); route();
}
boot();
})();
</script>
